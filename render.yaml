# Render Blueprint (https://render.com/docs/blueprint-spec).
# Render dashboard → New + → Blueprint → choose this repository. Render asks for the values marked "sync: false":
# type the keys THERE (never in git or in a chat). APP_PASSWORD is generated by Render: read it in the service's
# Environment tab and use it as the password when the browser asks (the user name can be anything).
services:
  - type: web
    name: jev-seo-radar
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: JEV_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: APP_PASSWORD
        generateValue: true
      # Optional, added by hand in the service's Environment tab (not listed here, so a Blueprint sync never asks for them):
      # OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY — let the whole-site audit ask ChatGPT, Claude and Gemini.
    # The free plan has a temporary file system: reports, settings and the cache are lost whenever the service
    # sleeps (after 15 idle minutes), restarts or redeploys. To keep them, change `plan` to 0.5c-512mb (Starter)
    # and uncomment the disk below.
    # disk:
    #   name: radar-data
    #   mountPath: /app/data
    #   sizeGB: 1
